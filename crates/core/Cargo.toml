[package]
name = "gc-core"
version.workspace = true
edition.workspace = true

[features]
default = ["cli"]
# git 실행 파일을 띄우는 백엔드(`CliBackend`)
cli = ["dep:ssh-key", "dep:libc"]
# 순수 Rust(gitoxide) 백엔드 `GixBackend`. 켜면 gix 의존성이 컴파일된다(기본 빌드는 아님)
gix = ["dep:gix", "dep:reqwest", "dep:rustls"]

[[test]]
name = "commit_graph"
required-features = ["cli"]

[[test]]
name = "diff_syntax"
required-features = ["cli"]

[[test]]
name = "eol"
required-features = ["cli"]

[[test]]
name = "git"
required-features = ["cli"]

[[test]]
name = "modules"
required-features = ["cli"]

[[test]]
name = "patch"
required-features = ["cli"]

[[test]]
name = "worktree"
required-features = ["cli"]

[[test]]
name = "gix_cross"
required-features = ["cli", "gix"]

[dependencies]
async-trait = "0.1"
gc-i18n = { path = "../i18n" }
tokio.workspace = true
serde.workspace = true
ssh-key = { optional = true, version = "0.6.7", default-features = false, features = ["ed25519", "encryption", "getrandom"] }

# 필요한 기능만: sha1, 리비전·인덱스·status·blob diff, 네트워크는 blocking + reqwest(rustls)
gix = { version = "0.90", optional = true, default-features = false, features = ["sha1", "revision", "index", "status", "blob-diff", "worktree-mutation", "blocking-http-transport-reqwest"] }
# TLS: reqwest 기본 rustls는 aws-lc-sys(C·cmake)를 끌어오므로 provider 없는 rustls + ring(Android 크로스컴파일이 쉬움)을 쓴다
reqwest = { version = "0.13", optional = true, default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
trash = "5"

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
tempfile = "3"
