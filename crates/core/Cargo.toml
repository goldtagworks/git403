[package]
name = "gc-core"
version.workspace = true
edition.workspace = true

[features]
default = ["cli"]
# git 실행 파일을 띄우는 백엔드(`CliBackend`)
cli = []
# 순수 Rust(gitoxide) 백엔드 자리(이름만 예약, 아직 구현 없음)
gix = []

[dependencies]
async-trait = "0.1"
gc-i18n = { path = "../i18n" }
tokio.workspace = true
serde.workspace = true
trash = "5"
ssh-key = { version = "0.6.7", default-features = false, features = ["ed25519", "encryption", "getrandom"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
