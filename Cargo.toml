[workspace]
resolver = "2"
members = ["crates/i18n", "crates/core", "crates/graph", "crates/hosting", "crates/ai", "crates/backend", "src-tauri"]

[workspace.package]
edition = "2021"
version = "1.0.0"
license = "UNLICENSED"

[workspace.dependencies]
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros", "sync", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
